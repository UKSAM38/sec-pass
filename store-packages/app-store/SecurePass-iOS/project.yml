name: SecurePass
options:
  bundleIdPrefix: io.github.uksam38
  deploymentTarget:
    iOS: "17.0"
packages:
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift.git
    exactVersion: 1.10.0
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  SecurePass:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: SecurePass
    dependencies:
      - package: CryptoSwift
      - target: SecurePassCredentialProvider
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.uksam38.secpass
        INFOPLIST_FILE: SecurePass/Info.plist
        CODE_SIGN_ENTITLEMENTS: SecurePass/SecurePass.entitlements
        PRODUCT_NAME: SecurePass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - SecurePassTests
  SecurePassCredentialProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: SecurePassCredentialProvider
    dependencies:
      - package: CryptoSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.uksam38.secpass.credential-provider
        INFOPLIST_FILE: SecurePassCredentialProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: SecurePassCredentialProvider/SecurePassCredentialProvider.entitlements
        PRODUCT_NAME: SecurePass AutoFill
        SKIP_INSTALL: YES
  SecurePassTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SecurePassTests
    resources:
      - path: SecurePassTests/INTEROP-TEST-VECTOR.spvault
    dependencies:
      - target: SecurePass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.uksam38.secpass.tests
        GENERATE_INFOPLIST_FILE: YES
